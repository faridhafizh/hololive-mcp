[project]
name = "hololive-mcp"
version = "0.1.0"
description = "An MCP server that exposes hololive English talent profiles and news to AI clients."
license = "MIT"
readme = "README.md"
authors = [
    { name = "faridhafizh", email = "plhr909@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "mcp[cli]>=2.3.0",
    "requests>=2.34.2",
]

[project.scripts]
hololive-mcp = "hololive_mcp:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
